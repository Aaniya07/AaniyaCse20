<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Demo</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

<div class="container">
    <div class="card">

        <h1>
            JavaScript is a scripting language used to make
            web pages interactive and dynamic.
        </h1>

        <input type="text"
               value="JavaScript is a scripting language used to">

        <div class="btn-row">
            <button>Change Heading</button>
            <button>Change Background</button>
            <button>Increase Font Size</button>
        </div>

        <div class="btn-row">
            <button>Show/Hide Paragraph</button>
            <button>Reset</button>
        </div>

        <p>
            This is a sample paragraph. JavaScript events can
            dynamically change content.
        </p>

    </div>
</div>

</body>
</html>
