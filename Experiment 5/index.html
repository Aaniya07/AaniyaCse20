<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Management System</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

<div class="outer-box">
    <div class="container">

        <h1>Employee Salary Management System</h1>

        <input type="text" placeholder="Employee Name"><br>

        <input type="text" placeholder="Employee ID"><br>

        <input type="number" placeholder="Salary"><br>

        <input type="text" placeholder="Department"><br>

        <button class="add-btn">Add Employee</button>

        <div class="btn-group">
            <button>Display All</button>
            <button>Salary &gt; 50000</button>
            <button>Total Salary</button>
            <button>Average Salary</button>
        </div>

        <button>Count by Department</button>

        <div id="output"></div>

    </div>
</div>

</body>
</html>
